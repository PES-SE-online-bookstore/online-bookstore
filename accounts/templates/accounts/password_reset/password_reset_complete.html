{% extends "base.html" %}

{% block title %}Password Changed | Online Bookstore{% endblock %}

{% block extra_head %}
<style>
    .status-card {
        width: 100%;
        max-width: 640px;
        margin: 1rem auto;
        padding: clamp(20px, 5vw, 36px);
        background: #ffffff;
        border: 1px solid #d7dee7;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .status-card h1 {
        margin-top: 0;
        color: #243b53;
        font-size: clamp(1.5rem, 5vw, 2rem);
        line-height: 1.3;
    }

    .success-message {
        padding: 14px 16px;
        border: 1px solid #8bc9a0;
        border-radius: 6px;
        background: #eaf7ee;
        color: #205b35;
    }

    .status-actions {
        margin-top: 24px;
    }
</style>
{% endblock %}

{% block content %}
<section class="status-card" aria-labelledby="status-heading">
    <h1 id="status-heading">Password Changed Successfully</h1>

    <p class="success-message" role="status">
        Your password has been reset successfully. You can now log in
        using your new password.
    </p>

    <div class="status-actions">
        <a class="button" href="{% url 'login' %}">
            Go to Login
        </a>
    </div>
</section>
{% endblock %}
