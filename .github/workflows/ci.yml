name: Django CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Django Checks and Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bookstore_ci
          POSTGRES_USER: bookstore_ci
          POSTGRES_PASSWORD: bookstore_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookstore_ci -d bookstore_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DB_NAME: bookstore_ci
      DB_USER: bookstore_ci
      DB_PASSWORD: bookstore_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run automated tests
        run: python manage.py test --verbosity 2

  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Check production health endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-connrefused \
            https://online-bookstore-10nn.onrender.com/health/