name: QA Controlled Browsing Load

on:
  workflow_dispatch:
    inputs:
      deployed_commit:
        description: Full commit currently live on Render (for evidence attribution)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: bookstore-public-load
  cancel-in-progress: false

jobs:
  browsing-load:
    name: Targeted 100/250-user catalogue cache retest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_PUBLIC_LOAD_WINDOW_CONFIRMED: 'YES'
      QA_LOAD_PROFILE: targeted-100-250
      QA_PROJECT_ROOT: ${{ github.workspace }}
      QA_LOAD_RUN_ID: LOAD-GHA-${{ github.run_id }}-${{ github.run_attempt }}
      QA_LOAD_OUTPUT: ${{ github.workspace }}/qa-load-evidence
      QA_REPORTED_DEPLOYED_SHA: ${{ inputs.deployed_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated load tooling
        run: |
          python -m pip install locust==2.47.0
      - name: Validate safety and response gates offline
        run: python qa/nfr/controlled_load.py --check
      - name: Run monitored 100-user then 250-user cache retest
        run: python qa/nfr/controlled_load.py --run
      - name: Upload actual results including stopped or failed stages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-load-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/qa-load-evidence/
          if-no-files-found: warn
          retention-days: 7
